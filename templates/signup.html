{% extends "base.html" %}
{% block title %}Sign Up — TEC{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <h2>Create your TEC account</h2>
        <p style="color: var(--text-muted); margin-top:-8px;">The name you enter here will appear on your certificates.</p>
        <form method="POST">
            <div class="field">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="e.g. Priya Sharma" required>
            </div>
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
        </form>
        <div class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
    </div>
</div>
{% endblock %}
