{% extends "base.html" %}
{% block title %}Admin Login — TEC{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <h2>🔐 Admin Login</h2>
        <p style="color: var(--text-muted); margin-top:-8px;">Restricted area — site administrators only.</p>
        <form method="POST">
            <div class="field">
                <label>Admin Password</label>
                <input type="password" name="password" placeholder="Enter admin password" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Enter Dashboard</button>
        </form>
    </div>
</div>
{% endblock %}
